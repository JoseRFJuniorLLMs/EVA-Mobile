name: eva_mobile
description: EVA - Assistente Virtual para Idosos
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^18.0.1

  # Audio
  audioplayers: ^5.2.1
  sound_stream: ^0.4.2
  permission_handler: 11.3.0

  # Network
  web_socket_channel: ^2.4.0
  http: ^1.2.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Utilities
  logger: ^2.0.2+1
  flutter_dotenv: ^5.1.0
  package_info_plus: ^9.0.0

  # UI
  cupertino_icons: ^1.0.6
  flutter_callkit_incoming: ^2.0.4
  flutter_webrtc: ^1.2.1

  # Used by notification_service / auth_provider
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - android/app/google-services.json
    - assets/images/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icone.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icone.png"
